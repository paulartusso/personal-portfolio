<section id="about" class="section about">
  <div class="about__intro" appReveal>
    <h2 class="section-title">
      <a href="#about" class="hero__scroll" [attr.aria-label]="i18n.ui().hero.scrollDown">
        <svg class="hero__ring hero__ring--outer" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="49" pathLength="100" />
        </svg>
        <svg class="hero__ring hero__ring--inner" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="20" cy="50" r="49" pathLength="100" />
        </svg>
      </a>
      {{ i18n.ui().about.title }}
    </h2>
    <p class="about__bio">{{ i18n.pick(profile.bio) }}</p>
  </div>
